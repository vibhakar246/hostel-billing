name: Deploy to S3 and Push Docker Image

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload to S3
        run: aws s3 sync . s3://hostel-billing --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1ZEDCCP6LN8US --paths "/*"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/vibhakar246/hostel-billing:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/vibhakar246/hostel-billing:latest
