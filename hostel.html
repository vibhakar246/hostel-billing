<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Bhawani Hostel Billing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .version {
            text-align: center;
            color: white;
            font-weight: bold;
            background: #28a745;
            padding: 10px;
        }

        #time {
            text-align: center;
            color: white;
            margin: 10px 0;
        }

        .container {
            width: 340px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in;
        }

        h1 {
            text-align: center;
        }

        .section-title {
            margin-top: 15px;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            color: #444;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            margin: 5px 0 10px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.4);
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
            transform: scale(1.03);
        }

        #result {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            color: green;
            opacity: 0;
            transition: 0.5s;
            white-space: pre-line;
        }

        #result.show {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="version">Version 5 🚀</div>
<h3 id="time"></h3>

<div class="container">
    <h1>Maa Bhawani Hostel</h1>

    <div class="section-title">Student Details</div>

    <label>Student Name:</label>
    <input type="text" id="name" placeholder="Enter name">

    <label>Student ID:</label>
    <input type="text" id="studentId" placeholder="Enter ID">

    <label>Father Name:</label>
    <input type="text" id="father" placeholder="Enter father name">

    <label>Mobile Number:</label>
    <input type="tel" id="mobile" placeholder="Enter mobile number">

    <label>Room Number:</label>
    <input type="text" id="room" placeholder="Enter room number">

    <div class="section-title">Charges</div>

    <label>Room Rent (₹):</label>
    <input type="number" id="rent">

    <label>Food Charges (₹):</label>
    <input type="number" id="food">

    <label>Electricity (₹):</label>
    <input type="number" id="electric">

    <button onclick="calculateBill()">Calculate Bill</button>

    <div id="result"></div>
</div>

<script>
document.getElementById("time").innerText =
  "Last Updated: " + new Date().toLocaleString();

function calculateBill() {
    let name = document.getElementById("name").value;
    let id = document.getElementById("studentId").value;
    let father = document.getElementById("father").value;
    let mobile = document.getElementById("mobile").value;
    let room = document.getElementById("room").value;

    let rent = parseInt(document.getElementById("rent").value) || 0;
    let food = parseInt(document.getElementById("food").value) || 0;
    let electric = parseInt(document.getElementById("electric").value) || 0;

    if (!name || !id || !father || !mobile || !room) {
        alert("Please fill all details");
        return;
    }

    if (mobile.length !== 10) {
        alert("Enter valid 10-digit mobile number");
        return;
    }

    let total = rent + food + electric;

    let result = document.getElementById("result");
    result.innerText =
        "Total Bill: ₹ " + total +
        "\n\nName: " + name +
        "\nID: " + id +
        "\nFather: " + father +
        "\nMobile: " + mobile +
        "\nRoom: " + room;

    result.classList.add("show");
}
</script>

</body>
</html>
