<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhawani Hostel Billing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 320px;
            margin: 60px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .version {
            text-align: center;
            color: white;
            font-weight: bold;
            background: #28a745;
            padding: 10px;
            border-radius: 0 0 10px 10px;
        }

        #time {
            text-align: center;
            color: white;
            margin-top: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            margin: 5px 0 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            text-align: center;
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="version">Version 4 🚀</div>
<h3 id="time"></h3>

<div class="container">
    <h1>Bhawani Hostel </h1>

    <label>Student Name:</label>
    <input type="text" id="name" placeholder="Enter name">

    <label>Room Number:</label>
    <input type="text" id="room" placeholder="Enter room number">

    <h3>Charges</h3>

    <label>Room Rent (₹):</label>
    <input type="number" id="rent">

    <label>Food Charges (₹):</label>
    <input type="number" id="food">

    <label>Electricity (₹):</label>
    <input type="number" id="electric">

    <button onclick="calculateBill()">Calculate Bill</button>

    <h2 id="result"></h2>
</div>

<script>
document.getElementById("time").innerText =
  "Last Updated: " + new Date().toLocaleString();

function calculateBill() {
    let rent = parseInt(document.getElementById("rent").value) || 0;
    let food = parseInt(document.getElementById("food").value) || 0;
    let electric = parseInt(document.getElementById("electric").value) || 0;

    let total = rent + food + electric;

    document.getElementById("result").innerText =
        "Total Bill: ₹ " + total;
}
</script>

</body>
</html>
