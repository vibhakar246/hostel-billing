<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhawani Group of Hotel & Hostel Pune(MH)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            padding: 20px;
        }

        /* Room Cards */
        .room-card {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .room-card:hover {
            transform: scale(1.05);
        }

        .room-card img {
            height: 180px;
            object-fit: cover;
        }

        /* Form Card */
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Button */
        .btn-custom {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <!-- Change logo.png if your filename is different -->
        <img src="logo.png" alt="Bhawani Logo" style="width:150px; display:block; margin:0 auto 15px;">

        <h1>Bhawani Hotel & Hostel Ltd.Pune(MH)(MP)(DL)</h1>
        <p>Your Home Away From Home</p>

    </div>

    <!-- Room Section -->
    <div class="row text-center mb-4">

        <div class="col-md-4 mb-3">
            <div class="card room-card">
                <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=400" class="card-img-top" alt="Single Room">
                <div class="card-body">
                    <h5>Single Sharing</h5>
                    <h4>₹18,000</h4>
                    <h6>Single Room</h6>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card room-card">
                <img src="https://images.unsplash.com/photo-1586105251261-72a756497a11?w=400" class="card-img-top" alt="Double Sharing">
                <div class="card-body">
                    <h5>Double Sharing</h5>
                    <h4>₹8,000</h4>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card room-card">
                <img src="https://images.unsplash.com/photo-1598928506311-c55ded91a20c?w=400" class="card-img-top" alt="Four Sharing">
                <div class="card-body">
                    <h5>4 Sharing</h5>
                    <h4>₹5,500</h4>
                </div>
            </div>
        </div>

    </div>

    <!-- Student Form -->
    <div class="form-card mx-auto" style="max-width:500px;">

        <h4 class="mb-3">Student Details</h4>

        <input type="text" class="form-control mb-2" placeholder="Student Name">
        <input type="text" class="form-control mb-2" placeholder="Student ID">
        <input type="text" class="form-control mb-2" placeholder="Father Name">
        <input type="tel" class="form-control mb-2" placeholder="Mobile Number">
        <input type="text" class="form-control mb-3" placeholder="Room Number">

        <h4 class="mb-3">Charges</h4>

        <input type="number" class="form-control mb-2" placeholder="Room Rent">
        <input type="number" class="form-control mb-2" placeholder="Food Charges">
        <input type="number" class="form-control mb-3" placeholder="Electricity Charges">

        <button class="btn btn-custom w-100">
            Calculate Bill
        </button>

    </div>

</div>

</body>
</html>
